<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102820">
  <title>جاهز Pro | خدمات وطلبات وإعلانات</title>
  <meta name="description" content="جاهز Pro - منصة الخدمات والطلبات والإعلانات في مكان واحد.">

  <style>
    :root {
      --green: #123b2c;
      --green-light: #1c503b;
      --gold: #e9b949;
      --bg: #f5f7f4;
      --text: #17251d;
      --muted: #738078;
      --white: #fff;
      --border: #e5eae5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.7;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(100% - 28px, 1050px);
      margin: auto;
    }

    header {
      background: var(--green);
      color: white;
      padding: 22px 0 28px;
      border-radius: 0 0 26px 26px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      color: var(--gold);
    }

    .brand small {
      display: block;
      color: #d7e4da;
      font-size: 11px;
      font-weight: normal;
    }

    .login-btn {
      color: white;
      border: 1px solid #739080;
      background: transparent;
      padding: 8px 14px;
      border-radius: 12px;
    }

    .hero {
      padding: 28px 0 8px;
    }

    .hero h1 {
      font-size: clamp(25px, 5vw, 38px);
      line-height: 1.5;
      margin: 0 0 8px;
    }

    .hero p {
      color: #d8e4dc;
      margin: 0;
    }

    .location {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .location select {
      min-width: 0;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #dce5dc;
      background: white;
      color: var(--text);
    }

    main {
      padding: 26px 0 105px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-title h2 {
      font-size: 21px;
      margin: 0;
    }

    .section-title span {
      font-size: 12px;
      color: var(--muted);
    }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .main-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 10px;
      text-align: center;
      box-shadow: 0 4px 15px #123b2c08;
    }

    .main-card .icon {
      display: block;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .main-card strong {
      display: block;
      font-size: 15px;
    }

    .main-card p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .main-card:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .panel {
      margin-top: 24px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .category {
      text-align: right;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      color: var(--text);
    }

    .category:hover {
      border-color: var(--green-light);
      background: #f4f8f4;
    }

    .feed {
      display: grid;
      gap: 10px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 22px 10px;
      border: 1px dashed #d6dfd6;
      border-radius: 12px;
      font-size: 14px;
    }

    .bottom-nav {
      position: fixed;
      z-index: 5;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid var(--border);
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px;
    }

    .nav-btn span {
      display: block;
      font-size: 20px;
    }

    .add-btn {
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 18px;
      background: var(--gold);
      color: var(--green);
      font-size: 34px;
      font-weight: bold;
      box-shadow: 0 5px 14px #123b2c24;
      margin-top: -28px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #07170fcc;
      padding: 18px;
      align-items: flex-end;
      justify-content: center;
    }

    .overlay.open {
      display: flex;
    }

    .sheet {
      width: min(100%, 520px);
      max-height: 90%;
      overflow-y: auto;
      background: white;
      border-radius: 22px;
      padding: 22px;
    }

    .sheet-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .sheet-head h2 {
      margin: 0 0 12px;
    }

    .close-btn {
      border: 0;
      background: #eef2ed;
      border-radius: 10px;
      padding: 6px 12px;
    }

    .action-list {
      display: grid;
      gap: 10px;
    }

    .action {
      text-align: right;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .action .icon {
      font-size: 27px;
    }

    .action strong,
    .action small {
      display: block;
    }

    .action small {
      color: var(--muted);
      margin-top: 3px;
    }

    .field {
      margin: 12px 0;
    }

    .field label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .field input,
    .field textarea,
    .field select {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid #dce3dc;
      border-radius: 11px;
      background: white;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .primary-btn {
      width: 100%;
      background: var(--green);
      color: white;
      border: 0;
      padding: 13px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 10px;
    }

    .notice {
      background: #fff6dd;
      color: #725315;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      margin-top: 12px;
    }

    .preview {
      max-width: 100%;
      max-height: 180px;
      display: none;
      margin-top: 10px;
      border-radius: 12px;
    }

    @media (max-width: 420px) {
      .main-grid {
        gap: 7px;
      }

      .main-card {
        padding: 15px 5px;
      }

      .main-card strong {
        font-size: 13px;
      }

      .location {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="topbar">
        <div class="brand">
          جاهز Pro
          <small>كل خدماتك وطلباتك وإعلاناتك بمكان واحد</small>
        </div>
        <button class="login-btn" id="loginBtn">دخول</button>
      </div>

      <div class="hero">
        <h1>شو محتاج اليوم؟</h1>
        <p>اطلب خدمة، اعرض شغلك، أو انشر إعلانك بسهولة.</p>
      </div>

      <div class="location">
        <select id="governorate" aria-label="المحافظة">
          <option value="">اختر المحافظة</option>
          <option>إدلب</option>
          <option>حلب</option>
          <option>دمشق</option>
          <option>ريف دمشق</option>
          <option>حمص</option>
          <option>حماة</option>
          <option>اللاذقية</option>
          <option>طرطوس</option>
          <option>درعا</option>
          <option>السويداء</option>
          <option>القنيطرة</option>
          <option>دير الزور</option>
          <option>الرقة</option>
          <option>الحسكة</option>
        </select>

        <select id="city" aria-label="المدينة">
          <option value="">اختر المدينة أو المنطقة</option>
          <option>إدلب</option>
          <option>أريحا</option>
          <option>سرمدا</option>
          <option>الدانا</option>
          <option>جسر الشغور</option>
          <option>معرة مصرين</option>
          <option>مدينة أخرى</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="section-title">
      <h2>أقسام جاهز Pro</h2>
      <span>اختر القسم المناسب</span>
    </div>

    <div class="main-grid">
      <button class="main-card" data-section="services">
        <span class="icon">🛠️</span>
        <strong>الخدمات</strong>
        <p>اعثر على مقدم خدمة</p>
      </button>

      <button class="main-card" data-section="requests">
        <span class="icon">📋</span>
        <strong>الطلبات</strong>
        <p>شوف شو الناس محتاجة</p>
      </button>

      <button class="main-card" data-section="ads">
        <span class="icon">📢</span>
        <strong>الإعلانات</strong>
        <p>بيع واشترِ وانشر إعلانك</p>
      </button>
    </div>

    <section class="panel" id="sectionPanel">
      <h2 id="panelTitle">الخدمات حسب الاختصاص</h2>
      <div class="categories" id="categories"></div>
    </section>

    <section class="panel">
      <h2 id="feedTitle">أحدث المنشورات</h2>
      <div class="feed" id="feed">
        <div class="empty">
          رح تظهر المنشورات هون بعد ربط الموقع بقاعدة البيانات.
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="التنقل الرئيسي">
    <button class="nav-btn" data-section="services">
      <span>🛠️</span>الخدمات
    </button>

    <button class="nav-btn" data-section="requests">
      <span>📋</span>الطلبات
    </button>

    <button class="add-btn" id="addBtn" aria-label="إضافة منشور">+</button>

    <button class="nav-btn" data-section="ads">
      <span>📢</span>الإعلانات
    </button>

    <button class="nav-btn" id="profileBtn">
      <span>👤</span>حسابي
    </button>
  </nav>

  <div class="overlay" id="overlay">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle">شو حابب تضيف؟</h2>
        <button class="close-btn" id="closeBtn">إغلاق ✕</button>
      </div>

      <div id="sheetContent"></div>
    </div>
  </div>

  <script>
    const sectionData = {
      services: {
        title: "الخدمات حسب الاختصاص",
        feed: "الخدمات المتاحة",
        categories: [
          "كهرباء",
          "تمديدات صحية",
          "دهان وديكور",
          "بناء وإكساء",
          "خدمات منزلية",
          "صيانة أجهزة",
          "سيارات وميكانيك",
          "تعليم ودروس",
          "نقل وشحن",
          "تقنية وإنترنت",
          "زراعة",
          "أطباء وعيادات",
          "صيدليات",
          "مخابر وأشعة",
          "محامون وخدمات قانونية",
          "طب بيطري",
          "مطاعم ومحلات",
          "خدمات أخرى"
        ]
      },

      requests: {
        title: "طلبات الناس",
        feed: "أحدث طلبات الخدمات",
        categories: [
          "كهرباء",
          "تمديدات صحية",
          "دهان وديكور",
          "بناء وإكساء",
          "خدمات منزلية",
          "صيانة أجهزة",
          "سيارات وميكانيك",
          "تعليم ودروس",
          "نقل وشحن",
          "تقنية وإنترنت",
          "زراعة",
          "أطباء وعيادات",
          "صيدليات",
          "مخابر وأشعة",
          "محامون",
          "طب بيطري",
          "طلبات أخرى"
        ]
      },

      ads: {
        title: "الإعلانات والتصنيفات",
        feed: "أحدث الإعلانات",
        categories: [
          "سيارات",
          "دراجات نارية",
          "عقارات للبيع",
          "عقارات للإيجار",
          "أراضٍ",
          "شاليهات ومسابح",
          "مطاعم ومحلات للبيع",
          "أثاث مستعمل",
          "برادات وغسالات",
          "مدافئ وأجهزة منزلية",
          "مطلوب للشراء",
          "إعلانات أخرى"
        ]
      }
    };

    const overlay = document.getElementById("overlay");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetContent = document.getElementById("sheetContent");
    const categories = document.getElementById("categories");
    const panelTitle = document.getElementById("panelTitle");
    const feedTitle = document.getElementById("feedTitle");

    let currentSection = "services";

    function renderSection(section) {
      if (!sectionData[section]) return;

      currentSection = section;
      const data = sectionData[section];

      panelTitle.textContent = data.title;
      feedTitle.textContent = data.feed;
      categories.replaceChildren();

      data.categories.forEach(category => {
        const button = document.createElement("button");
        button.className = "category";
        button.textContent = category + " ←";

        button.addEventListener("click", () => {
          openForm(section, category);
        });

        categories.appendChild(button);
      });

      document.getElementById("sectionPanel").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function openSheet(title, content) {
      sheetTitle.textContent = title;
      sheetContent.replaceChildren();
      sheetContent.appendChild(content);
      overlay.classList.add("open");
      document.getElementById("closeBtn").focus();
    }

    function closeSheet() {
      overlay.classList.remove("open");
    }

    function makeActions(actions) {
      const list = document.createElement("div");
      list.className = "action-list";

      actions.forEach(item => {
        const button = document.createElement("button");
        button.className = "action";

        const icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = item.icon;

        const text = document.createElement("span");
        const strong = document.createElement("strong");
        strong.textContent = item.title;

        const small = document.createElement("small");
        small.textContent = item.description;

        text.append(strong, small);
        button.append(icon, text);

        button.addEventListener("click", item.action);
        list.appendChild(button);
      });

      return list;
    }

    function openAddMenu() {
      const actions = makeActions([
        {
          icon: "🔎",
          title: "بدي خدمة",
          description: "انشر طلبك ليشوفه مقدمو الخدمات",
          action: () => openForm("requests")
        },
        {
          icon: "🛠️",
          title: "عندي خدمة",
          description: "اعرض خدمتك واختصاصك",
          action: () => openForm("services")
        },
        {
          icon: "📢",
          title: "عندي إعلان",
          description: "انشر إعلان بيع أو شراء أو إيجار",
          action: () => openForm("ads")
        }
      ]);

      openSheet("شو حابب تضيف؟", actions);
    }

    function openForm(type, chosenCategory = "") {
      const labels = {
        services: "إضافة خدمة",
        requests: "إضافة طلب خدمة",
        ads: "إضافة إعلان"
      };

      const wrapper = document.createElement("form");

      wrapper.innerHTML = `
        <div class="notice">
          هذه واجهة أولية. النشر الفعلي سيتاح بعد ربط قاعدة البيانات وتسجيل الدخول.
        </div>

        <div class="field">
          <label for="postTitle">العنوان *</label>
          <input id="postTitle" name="title" required maxlength="120"
                 placeholder="اكتب عنواناً واضحاً">
        </div>

        <div class="field">
          <label for="postCategory">التصنيف *</label>
          <select id="postCategory" name="category" required>
            <option value="">اختر التصنيف</option>
          </select>
        </div>

        <div class="field">
          <label for="postDescription">التفاصيل *</label>
          <textarea id="postDescription" name="description" required
                    maxlength="3000" placeholder="اكتب التفاصيل"></textarea>
        </div>

        <div class="field">
          <label for="postGovernorate">المحافظة</label>
          <select id="postGovernorate" name="governorate">
            <option value="">اختر المحافظة</option>
            ${[
              "إدلب", "حلب", "دمشق", "ريف دمشق", "حمص",
              "حماة", "اللاذقية", "طرطوس", "درعا",
              "السويداء", "القنيطرة", "دير الزور",
              "الرقة", "الحسكة"
            ].map(x => `<option>${x}</option>`).join("")}
          </select>
        </div>

        <div class="field">
          <label for="postCity">المدينة أو المنطقة</label>
          <input id="postCity" name="city" maxlength="100"
                 placeholder="المدينة أو المنطقة أو القرية">
        </div>

        <div class="field">
          <label for="postPrice" id="priceLabel">السعر أو الميزانية</label>
          <input id="postPrice" name="price" type="number"
                 min="0" step="0.01" placeholder="اختياري">
        </div>

        <div class="field">
          <label for="postCurrency">العملة</label>
          <select id="postCurrency" name="currency">
            <option value="SYP">ليرة سورية</option>
            <option value="USD">دولار أمريكي</option>
            <option value="TRY">ليرة تركية</option>
          </select>
        </div>

        <div class="field">
          <label for="postPhone">رقم التواصل</label>
          <input id="postPhone" name="phone" type="tel"
                 maxlength="30" placeholder="رقم الهاتف">
        </div>

        <div class="field">
          <label for="postImage">صورة (اختيارية، حتى 5 ميغابايت)</label>
          <input id="postImage" name="image" type="file" accept="image/*">
          <img id="imagePreview" class="preview" alt="معاينة الصورة">
        </div>

        <button class="primary-btn" type="submit">متابعة النشر</button>
      `;

      const categorySelect = wrapper.querySelector("#postCategory");
      const availableCategories =
        type === "ads"
          ? sectionData.ads.categories
          : type === "requests"
            ? sectionData.requests.categories
            : sectionData.services.categories;

      availableCategories.forEach(category => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categorySelect.appendChild(option);
      });

      categorySelect.value = chosenCategory;

      wrapper.querySelector("#priceLabel").textContent =
        type === "requests" ? "الميزانية" : "السعر";

      const imageInput = wrapper.querySelector("#postImage");
      const preview = wrapper.querySelector("#imagePreview");

      let previewUrl = null;

      imageInput.addEventListener("change", () => {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = null;
        preview.removeAttribute("src");
        preview.style.display = "none";

        const file = imageInput.files[0];
        if (!file) return;

        if (!file.type.startsWith("image/")) {
          imageInput.value = "";
          alert("يرجى اختيار ملف صورة.");
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          imageInput.value = "";
          alert("حجم الصورة يجب ألا يتجاوز 5 ميغابايت.");
          return;
        }

        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
        preview.style.display = "block";
      });

      wrapper.addEventListener("submit", event => {
        event.preventDefault();

        alert(
          "الواجهة جاهزة مبدئياً، لكن النشر غير مفعّل بعد. " +
          "الخطوة التالية هي ربط النموذج بتسجيل الدخول وقاعدة Supabase."
        );
      });

      openSheet(labels[type], wrapper);
    }

    document.querySelectorAll("[data-section]").forEach(button => {
      button.addEventListener("click", () => {
        renderSection(button.dataset.section);
      });
    });

    document.getElementById("addBtn").addEventListener("click", openAddMenu);

    document.getElementById("closeBtn").addEventListener("click", closeSheet);

    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeSheet();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeSheet();
    });

    document.getElementById("loginBtn").addEventListener("click", () => {
      alert("تسجيل الدخول سيتم تفعيله بعد ربط Supabase Auth.");
    });

    document.getElementById("profileBtn").addEventListener("click", () => {
      alert("صفحة الحساب ستُفعّل بعد إعداد تسجيل الدخول.");
    });

    renderSection("services");
  </script>
</body>
</html>
